[project]
name = "nsy-churn"
version = "0.1.0"
description = "Moteur de prediction de resiliation client avec explicabilite locale"
requires-python = ">=3.12"

# Contraintes minimales seulement. Les versions exactes sont figees dans uv.lock.
# Voir docs/decisions.md, decision D9.
dependencies = [
    "pandas>=3.0",
    "numpy>=2.5",
    "scikit-learn>=1.9",
    "xgboost>=3.4",
    # shap est volontairement absent de la production : XGBoost calcule les memes
    # contributions nativement via pred_contribs, au bit pres et plus vite, sans
    # tirer numba ni llvmlite. Voir docs/decisions.md, decision D12.
    "pydantic>=2.13",
    "pyarrow>=21.0",
    "pyyaml>=6.0",
    "seaborn>=0.13",
    # Dette D9 : seaborn 0.13.2 declenche une depreciation matplotlib sur le
    # parametre `vert`, qui deviendra une erreur en matplotlib 3.13.
    # Contrainte a lever a la prochaine version de seaborn.
    "matplotlib>=3.9,<3.13",
    # Interface de restitution en lecture seule. Voir decision D15.
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    # shap sert a l'exploration et a la comparaison de modeles, jamais en production.
    "shap>=0.52",
    # telechargement du jeu KKBox, execute une seule fois hors pipeline.
    "kaggle>=2.2",  # la syntaxe de la CLI a change entre les series 1.x et 2.x
    # les fichiers KKBox sont livres en .7z, format non gere nativement par Python
    "py7zr>=1.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pandas-stubs",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "PD", "PL", "RUF"]
# DTZ : interdit les datetime naifs, exigence du contrat de donnees.
# PD  : regles pandas, evite les anti-patterns silencieux.

[tool.mypy]
python_version = "3.12"
# strict = true  # remis apres l'echeance de candidature, voir decision D16
check_untyped_defs = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["shap.*", "xgboost.*", "seaborn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::FutureWarning"]
