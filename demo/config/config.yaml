# Configuration de la demonstration en ligne, generee par scripts/build_demo.py.
# Ne pas modifier a la main : relancer le script. Voir decision D22.
project:
  name: nsy-churn
  version: 0.1.0
  random_seed: 20260907
active_source: kkbox
sources:
  kkbox:
    label: KKBox WSDM Churn Prediction Challenge
    is_synthetic: false
    horizon_days: 30
    embargo_days: 30
    sample_accounts: 50000
    chunk_size: 1000000
    raw_files:
      members: members_v3.csv
      transactions_history: transactions.csv
      transactions_recent: transactions_v2.csv
      user_logs_history: user_logs.csv
      user_logs_recent: user_logs_v2.csv
      official_labels: train_v2.csv
  synthetic:
    label: Jeu synthetique genere localement
    is_synthetic: true
    horizon_days: 60
    embargo_days: 60
    n_accounts: 5000
    history_start: '2024-01-01'
    history_end: '2026-09-01'
    annual_churn_rate: 0.12
    unpredictable_churn_share: 0.25
    missing_data_rate: 0.05
    duplicate_timestamp_rate: 0.1
business:
  min_account_age_days: 60
  weekly_capacity_k: 50
  top_factors: 3
features:
  observation_frequency: W-MON
  windows_days:
  - 7
  - 30
  - 90
  min_history_days: 90
  datetime_resolution: us
evaluation:
  n_splits: 4
  scoring_period: W-MON
  logistic_regularisation:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
model:
  algorithm: xgboost
  significance_quantile: 0.75
  param_grid:
    max_depth:
    - 2
    - 3
    - 4
    - 6
    n_estimators:
    - 100
    - 300
    - 600
    learning_rate:
    - 0.05
    - 0.1
export:
  csv_encoding: utf-8-sig
  csv_separator: ;
  csv_decimal: ','
  max_label_length: 255
interface:
  missing_export_notice: 'La liste des abonnés KKBox n''est pas publiée en ligne :
    ces données individuelles relèvent des règles de la compétition, et seules les
    mesures agrégées de performance sont montrées. Pour parcourir la liste et la fiche
    d''un compte, choisissez la source « Jeu synthetique genere localement » : une
    chaîne complète y tourne sur des données simulées.'
paths:
  raw: data/raw
  processed: data/processed
  exports: data/exports
  models: models
  reports: reports
  feature_mapping: config/feature_mapping.yaml
