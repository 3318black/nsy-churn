# Correspondance entre variable technique et libelle metier.
# Dictionnaire statique, deterministe et testable. Aucun modele de langage
# n'intervient dans cette traduction. Voir AGENTS.md section 4.
#
# La cle est le nom de la variable d'origine, avant encodage. L'agregation des
# contributions SHAP se fait a ce niveau. Voir decision D7.
#
# `label` est affiche tel quel au commercial, prefixe par `source`.
# Exemple de rendu : "[SUPPORT] Hausse des tickets support".
# `action` indique le levier a actionner pendant l'appel. C'est ce qui distingue
# un facteur actionnable d'une simple constatation.

nb_tickets_support_30j:
  label: "Hausse des tickets support"
  source: "SUPPORT"
  action: "Verifier les incidents ouverts avant l'appel"

