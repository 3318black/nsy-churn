  # Variable la plus interessante du jeu KKBox : un utilisateur peut conserver
  # son temps d'ecoute tout en abandonnant de plus en plus de morceaux avant
  # la fin. Le niveau absolu ne le montre pas, la tendance si.

diversite_contenus_30j:
