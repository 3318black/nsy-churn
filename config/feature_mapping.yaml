# Correspondance entre variable technique et libelle metier.
# Dictionnaire statique, deterministe et testable. Aucun modele de langage
# n'intervient dans cette traduction. Voir AGENTS.md section 4.
#
# La cle est le nom de la variable d'origine, avant encodage. L'agregation des
# contributions se fait a ce niveau. Voir decision D7.
#
# `label` est affiche tel quel, prefixe par `source`, ce qui donne par exemple
# "[PRODUCT] Chute de la frequence d'usage".
# `action` indique le levier a actionner. C'est ce qui distingue un facteur
# actionnable d'une simple constatation. Il reste vide pour les variables
# structurelles, sur lesquelles aucune action n'est possible.
#
# Toutes les variables ne sont pas disponibles sur toutes les sources. Une
# variable absente du jeu courant est simplement inutilisee, sans erreur.
# Le jeu KKBox ne comporte ni support ni contact commercial.

# --- PRODUCT, disponible sur KKBox et sur le jeu synthetique ---

nb_connexions_30j:
  label: "Faible frequence d'usage"
  source: "PRODUCT"
  action: "Identifier les utilisateurs devenus inactifs"

tendance_connexions_30j_vs_30j:
  label: "Chute de la frequence d'usage"
  source: "PRODUCT"
  action: "Proposer une reprise en main"

