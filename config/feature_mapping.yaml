# Correspondance entre variable d'origine et libelle metier.
# Dictionnaire statique, deterministe et testable. Aucun modele de langage
# n'intervient dans cette traduction. Voir AGENTS.md section 4.
#
# La cle est la variable d'origine, telle que la calcule
# src/churn/features/catalog.py : le type d'evenement pour les fenetres de
# comptage et de somme, prefixe par trend_ pour leurs tendances, ou le nom de la
# variable structurelle. Les contributions des fenetres 7, 30 et 90 jours d'un
# meme type sont sommees a ce niveau avant l'extraction des facteurs. Voir D7.
#
# `label` est affiche tel quel, prefixe par `source`, ce qui donne par exemple
# "[PRODUCT] Fréquence d'usage". Les libelles portent leurs accents parce qu'ils
# sont lus par le metier, dans l'export et dans l'interface.
#
# Les libelles nomment un signal, jamais son sens. Une contribution positive dit
# que la valeur de la variable pousse le risque a la hausse, pas si cette valeur
# est haute ou basse. Ecrire "Chute de l'usage" serait une supposition, donc un
# motif invente. Le sens sera tire de la valeur elle-meme dans un lot ulterieur.
#
# `action` indique le levier a actionner. Il reste vide pour les variables
# structurelles, sur lesquelles aucune action n'est possible.
#
# Une variable absente du jeu courant est simplement inutilisee. Une variable
# produite par le pipeline mais absente d'ici fait echouer l'entrainement : un
# facteur ne s'affiche jamais sous son nom technique.

