# Parametres du projet. Aucune valeur metier ne doit apparaitre en dur dans le code.
# Une cle absente leve une erreur au demarrage, jamais une valeur par defaut silencieuse.

project:
  name: "nsy-churn"
  version: "0.1.0"
  random_seed: 20260907

# Source de donnees active. Deux profils, deux roles distincts (decision D14) :
#   kkbox     : porte la demonstration et toutes les mesures de performance
#   synthetic : sert les tests automatises, jamais la demonstration
active_source: "kkbox"

sources:
  kkbox:
    label: "KKBox WSDM Churn Prediction Challenge"
    is_synthetic: false
    # Horizon impose par la definition officielle du churn : aucun abonnement
    # valide dans les 30 jours suivant l'expiration. Voir docs/dataset-kkbox.md.
    horizon_days: 30
    embargo_days: 30
    # Echantillonnage des comptes avant toute lecture des logs.
    sample_accounts: 50000
    # user_logs_v2.csv pese environ 30 Go, lecture par morceaux obligatoire.
    chunk_size: 1000000
    # Deux generations de fichiers, et les deux sont necessaires. Les fichiers
    # suffixes _v2 ne remplacent pas les autres, ils les completent sur la
    # periode recente : 74,8 % de transactions_v2.csv tombe en mars 2017.
    # Ne prendre que les _v2 reduirait l'historique a un mois.
    # Voir docs/dataset-kkbox.md section 2.1.
    raw_files:
      members: "members_v3.csv"
      transactions_history: "transactions.csv"
      transactions_recent: "transactions_v2.csv"
      user_logs_history: "user_logs.csv"
      user_logs_recent: "user_logs_v2.csv"
      official_labels: "train_v2.csv"

  synthetic:
    label: "Jeu synthetique genere localement"
    is_synthetic: true
    horizon_days: 60
    embargo_days: 60
    n_accounts: 5000
    history_start: "2024-01-01"
    history_end: "2026-09-01"
    annual_churn_rate: 0.12
    # Part des resiliations sans aucun signal precurseur. Fixe le plafond de
    # performance atteignable et empeche de se mentir sur la qualite du modele.
    unpredictable_churn_share: 0.25
    missing_data_rate: 0.05
    # Proportion d'horodatages volontairement dupliques pour un meme compte.
    # Ce cas produisait 10,5 % de lignes fausses lors de la mesure du 2026-09-07.
    duplicate_timestamp_rate: 0.10

# Regles metier communes a toutes les sources.
business:
  # Anciennete minimale d'un compte pour entrer dans la grille.
  min_account_age_days: 60
  # Capacite de traitement hebdomadaire, qui fixe le K de la Precision@K.
  # Sur KKBox, aucune equipe commerciale n'existe : K est alors une capacite
  # hypothetique, ce que le rapport doit indiquer explicitement.
  weekly_capacity_k: 50
  top_factors: 3

# Construction du jeu d'apprentissage. Voir docs/data-contract.md section 3.
features:
  observation_frequency: "W-MON"
  windows_days: [7, 30, 90]
  min_history_days: 90
  # Resolution temporelle imposee a l'ingestion. Sous pandas 3.0, melanger
  # [us] et [ns] fait echouer merge_asof. Voir data-contract.md section 3.5.
  datetime_resolution: "us"

# Protocole d'evaluation. Voir decisions D4 et D5.
# embargo_days est defini par source et doit rester superieur ou egal a
# horizon_days. La coherence est verifiee au demarrage.
evaluation:
  n_splits: 4
  scoring_period: "W-MON"

# Modelisation.
model:
  algorithm: "xgboost"
  # Quantile de la distribution des contributions absolues qui definit le seuil
  # de signification. Calcule a l'entrainement, jamais fige en dur. Voir D7.
  significance_quantile: 0.75
  # Grille reduite et assumee, decision D16.
  param_grid:
    max_depth: [4, 6]
    n_estimators: [300, 600]
    learning_rate: [0.05, 0.1]

# Restitution. Voir decision D8.
export:
  # utf-8-sig : Excel sous Windows casse les accents sans marque d'ordre d'octets.
  csv_encoding: "utf-8-sig"
  csv_separator: ";"
  max_label_length: 255

# Chemins. Aucun module ne fabrique un chemin lui-meme.
paths:
  raw: "data/raw"
  processed: "data/processed"
  exports: "data/exports"
  models: "models"
  reports: "reports"
  feature_mapping: "config/feature_mapping.yaml"
