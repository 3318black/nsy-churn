# Parametres du projet. Aucune valeur metier ne doit apparaitre en dur dans le code.
# Une cle absente leve une erreur au demarrage, jamais une valeur par defaut silencieuse.

project:
  name: "nsy-churn"
  version: "0.1.0"
  random_seed: 20260907

# Regles metier. Voir docs/decisions.md, points ouverts O1 a O3.
business:
  # Horizon de prediction en jours. A confirmer avec le delai reel
  # d'intervention commerciale (point ouvert O3).
  horizon_days: 60
  # Anciennete minimale d'un compte pour entrer dans la grille.
  min_account_age_days: 60
  # Capacite de traitement hebdomadaire de l'equipe commerciale.
  # Fixe le K de la Precision@K (point ouvert O2).
  weekly_capacity_k: 50
  # Nombre de facteurs de risque restitues par compte.
  top_factors: 3

# Construction du jeu d'apprentissage. Voir docs/data-contract.md section 3.
features:
  # Pas de la grille d'observation. "W-MON" place chaque T0 un lundi.
  observation_frequency: "W-MON"
  # Fenetres glissantes autorisees, en jours. Toute autre fenetre doit etre
  # ajoutee ici, jamais codee en dur.
  windows_days: [7, 30, 90]
  # Profondeur minimale d'historique exigee avant qu'un couple entre dans la grille.
  min_history_days: 90

# Protocole d'evaluation. Voir decisions D4 et D5.
evaluation:
  # Embargo entre la fin de l'entrainement et le debut du test, en jours.
  # Doit etre superieur ou egal a business.horizon_days. Verifie au demarrage.
  embargo_days: 60
  # Nombre de decoupages temporels emboites.
  n_splits: 4
  # Periode de regroupement pour le calcul de la Precision@K.
  scoring_period: "W-MON"

# Modelisation.
model:
  algorithm: "xgboost"
  # Quantile de la distribution des contributions absolues qui definit le seuil
  # de signification SHAP. Calcule a l'entrainement, jamais fige en dur.
  # Voir decision D7 et revue-spec-v3.md section 3.5.
  shap_significance_quantile: 0.75

# Restitution. Voir decision D8.
export:
  # utf-8-sig : Excel sous Windows casse les accents sans marque d'ordre d'octets.
  csv_encoding: "utf-8-sig"
  csv_separator: ";"
  # Longueur maximale d'un libelle de facteur de risque.
  max_label_length: 255

# Chemins. Aucun module ne fabrique un chemin lui-meme.
paths:
  raw: "data/raw"
  processed: "data/processed"
  exports: "data/exports"
  models: "models"
  reports: "reports"
  feature_mapping: "config/feature_mapping.yaml"

# Generateur de donnees synthetiques. Voir decisions D1 et D3.
synthetic:
  n_accounts: 5000
  history_start: "2024-01-01"
  history_end: "2026-09-01"
  # Taux de churn annuel vise.
  annual_churn_rate: 0.12
  # Part des resiliations sans aucun signal precurseur. Fixe le plafond de
  # performance atteignable et empeche de se mentir sur la qualite du modele.
  unpredictable_churn_share: 0.25
  # Part d'evenements manquants, aucune source reelle n'est complete.
  missing_data_rate: 0.05
